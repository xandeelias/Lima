<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário Cadastro</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <h1>Formulário de Cadastro</h1>
    <form action="https://webhook.site/865ede0b-9267-4a98-ab6e-5d0c357cd9fb" method="post">
        <label for="nome">Nome:</label>
        <input 
            type="text" 
            id="nome" 
            name="nome" 
            min-length="2"
            max-length="50"
            placeholder="Digite seu Nome"
            required
        >
        <br>
        <label for="email">Email:</label>
        <input 
            type="email" 
            id="email" 
            name="email" 
            placeholder="Digite seu Email"
            required
        >
        <br>
        <label for="telefone">Telefone:</label>
        <input 
            type="tel" 
            id="telefone" 
            name="telefone"
            required
            placeholder="(XX) XXXXX-XXXX"
            pattern="\(\d{2}\) \d{4,5}-\d{4}"
            
        >
        <br>
        <label for="idade">Idade:</label>
        <input 
            type="number" 
            id="idade" 
            name="idade" 
            min-length="18"
            max-length="120"
            step="1"
            required
        >
        <br>
        <label for="dat-nascimento">Data Nasc.:</label>
        <input 
            type="date" 
            id="data-nascimento" 
            name="data-nascimento" 
            min="1900-01-01"
            max-length="24-07-2026"
            required
        >
        <br>
        <label for="website">WebSite:</label>
        <input 
            type="url" 
            id="website" 
            name="website"
            placeholder="https://www.seusite.com"
            required
        >
        <br>
        <label for="comentarios">Comentários:</label>
        <textarea
            id="comentarios" 
            name="comentarios"
            rows="4"
            cols="50"
            maxlength="500"
            placeholder="Deixe o seu Comentários"
        ></textarea>
        <br>

        <button type="submit">Cadastrar</button>
    </form>
</body>
</html>
