<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamon
    d:ital,wght@0,300..700;1,300..700&family=Orbitron:wght@400..900&displa
    y=swap" >
</head>
<body>
    <form id="mForms" action="https://webhook.site/865ede0b-9267-4a98-ab6e-5d0c357cd9fb" method="post">
        <label for="nome" style="font-family: Orbitron;"><b>Nome:</b></label>
        <input type="text" 
               id="nome" 
               name="nome" 
               placeholder="Digite seu Nome" 
               required
        >
        <label for="email" style="font-family: Orbitron;"><b>Email:</b></label>
        <input type="email" 
               id="email" 
               name="email" 
               placeholder="e-mail@exemplo.com" 
               required
        >
        <label for="senha" style="font-family: Orbitron;"><b>Senha:</b></label>
        <input type="password" 
               id="senha" 
               name="senha" 
               placeholder="Digite sua Senha"
               minlength="8"
               pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}" 
               required
        >
        <label for="idade" style="font-family: Orbitron;"><b>Idade:</b></label>
        <input type="number" 
               id="Idade" 
               name="idade" 
               min="0" 
               max="120" 
               step="1"
               value="16"
               required
        >
        <button type="submit">Enviar</button>
    </form>
</body>
</html>
